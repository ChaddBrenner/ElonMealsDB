version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      npm-patch-and-minor:
        update-types:
          - minor
          - patch
  - package-ecosystem: pip
    directory: /scraper
    schedule:
      interval: weekly
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
